<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма обратной связи</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Обратная связь</h2>
        <form action="index.php" method="POST">
            <label for="first_name">Имя:</label>
            <input type="text" id="first_name" name="first_name" required>

            <label for="last_name">Фамилия:</label>
            <input type="text" id="last_name" name="last_name" required>

            <label for="email">Электронная почта:</label>
            <input type="email" id="email" name="email" required>

            <label for="feedback">Отзыв:</label>
            <textarea id="feedback" name="feedback" rows="4" required></textarea>

            <label>Оцените нас:</label>
            <div class="rating">
                <input type="radio" id="rating_5" name="rating" value="★★★★★" required>
                <label for="rating_5">★★★★★</label>
                <input type="radio" id="rating_4" name="rating" value="★★★★">
                <label for="rating_4">★★★★</label>
                <input type="radio" id="rating_3" name="rating" value="★★★">
                <label for="rating_3">★★★</label>
                <input type="radio" id="rating_2" name="rating" value="★★">
                <label for="rating_2">★★</label>
                <input type="radio" id="rating_1" name="rating" value="★">
                <label for="rating_1">★</label>
            </div>

            <label>Ваши предпочтения:</label>
            <div class="preferences">
                <input type="checkbox" id="updates" name="preferences[]" value="Получать обновления">
                <label for="updates">Получать обновления</label>
                <input type="checkbox" id="news" name="preferences[]" value="Получать новости">
                <label for="news">Получать новости</label>
                <input type="checkbox" id="offers" name="preferences[]" value="Получать специальные предложения">
                <label for="offers">Получать специальные предложения</label>
            </div>

            <input type="submit" value="Отправить">
        </form>
    </div>
</body>
</html>
